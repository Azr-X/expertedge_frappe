<div class="student-attendance-page">
	<div class="row mb-4 align-items-end">
		<div class="col-md-3" id="batch-filter"></div>
		<div class="col-md-2" id="from-date-filter"></div>
		<div class="col-md-2" id="to-date-filter"></div>
		<div class="col-md-5 d-flex align-items-end gap-3 pb-2">
			<button class="btn btn-primary btn-sm" id="btn-refresh">Refresh</button>
			<label class="d-flex align-items-center gap-2 mb-0" style="font-size:13px;cursor:pointer;white-space:nowrap">
				<input type="checkbox" id="chk-absent-only" style="margin:0"> Absent Only
			</label>
		</div>
	</div>

	<div id="heatmap-container"></div>

	<div class="mt-3 d-flex gap-3 align-items-center" style="font-size:12px">
		<span><span class="indicator-pill green"></span> Present</span>
		<span><span class="indicator-pill red"></span> Absent</span>
		<span><span class="indicator-pill gray"></span> No Class</span>
	</div>
</div>
